services:

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./laravel/public:/var/www/html/public:ro
      - laravel_storage:/var/www/html/storage:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - laravel
      - python-api

  laravel:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./laravel:/var/www/html
      - laravel_storage:/var/www/html/storage
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_CHANNEL: stderr
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: predis
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: file
      AI_API_URL: http://python-api:8000
      AI_INTERNAL_KEY: ${INTERNAL_API_KEY}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      TURNSTILE_SITE_KEY_CHAT: ${TURNSTILE_SITE_KEY_CHAT}
      TURNSTILE_SECRET_KEY_CHAT: ${TURNSTILE_SECRET_KEY_CHAT}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started

  queue-worker:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    restart: unless-stopped
    command: php artisan queue:work redis --queue=uploads,crawlers,default --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./laravel:/var/www/html
      - laravel_storage:/var/www/html/storage
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_CHANNEL: stderr
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: predis
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: file
      AI_API_URL: http://python-api:8000
      AI_INTERNAL_KEY: ${INTERNAL_API_KEY}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      TURNSTILE_SITE_KEY_CHAT: ${TURNSTILE_SITE_KEY_CHAT}
      TURNSTILE_SECRET_KEY_CHAT: ${TURNSTILE_SECRET_KEY_CHAT}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  python-api:
    build:
      context: ./python-api
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./python-api:/app
      - ./data/docs:/app/docs
    environment:
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
      OPENSEARCH_INDEX: ${OPENSEARCH_INDEX:-minecraft_docs}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_DATABASE}
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - opensearch
      - mariadb

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  mariadb:
    image: mariadb:11.3
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  opensearch_data:
  mariadb_data:
  redis_data:
  laravel_storage:
