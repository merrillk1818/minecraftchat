# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name minecraftchat.ai www.minecraftchat.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://minecraftchat.ai$request_uri;
    }
}

# Redirect www to non-www
server {
    listen 443 ssl;
    server_name www.minecraftchat.ai;

    ssl_certificate     /etc/letsencrypt/live/minecraftchat.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minecraftchat.ai/privkey.pem;

    return 301 https://minecraftchat.ai$request_uri;
}

# Primary HTTPS server
server {
    listen 443 ssl;
    server_name minecraftchat.ai;
    root /var/www/html/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/minecraftchat.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minecraftchat.ai/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10M;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    limit_req zone=general burst=20 nodelay;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.ht { deny all; }
    location ~ /\.   { deny all; }
}
